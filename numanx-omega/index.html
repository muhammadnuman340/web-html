  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('uc_theme_class');
          if (t === null) {
            t = 'dark';
            localStorage.setItem('uc_theme_class', 'dark');
          }
          if (t) document.body.className = t;
          var f = localStorage.getItem('uc_font') || 'inter';
          if (f === 'system') document.body.classList.add('font-system');
          else document.body.classList.add('font-inter');
        } catch(e) {}
      })();
    </script>
  </body>
